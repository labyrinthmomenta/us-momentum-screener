<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US Momentum Screener</title>
<style>
  :root {
    --bg:      #0a0e17;
    --bg2:     #111827;
    --bg3:     #1a2235;
    --border:  #1e2d45;
    --accent:  #3b82f6;
    --accent2: #60a5fa;
    --text1:   #e2e8f0;
    --text2:   #94a3b8;
    --green:   #22c55e;
    --red:     #ef4444;
    --yellow:  #f59e0b;
    --radius:  8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text1); font-family: 'Inter', system-ui, sans-serif; font-size: 13px; }

  /* NAV */
  nav { display: flex; align-items: center; gap: 16px; padding: 12px 24px;
        background: var(--bg2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .nav-brand { font-size: 15px; font-weight: 700; color: var(--accent2); letter-spacing: 1px; }
  .nav-brand span { color: var(--text2); font-weight: 400; }
  .nav-link { color: var(--text2); text-decoration: none; padding: 4px 10px; border-radius: 4px;
              transition: color .2s; font-size: 12px; }
  .nav-link:hover, .nav-link.active { color: var(--text1); background: var(--bg3); }

  /* META BAR */
  .meta-bar { display: flex; gap: 24px; align-items: center; padding: 10px 24px;
              background: var(--bg2); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .meta-item { display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .meta-dot  { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .meta-label { color: var(--text2); }
  .meta-val   { color: var(--text1); font-weight: 600; }

  /* FILTERS */
  .filters { display: flex; gap: 10px; padding: 14px 24px; flex-wrap: wrap; align-items: center; }
  input[type=text], select {
    background: var(--bg2); border: 1px solid var(--border); color: var(--text1);
    padding: 6px 10px; border-radius: var(--radius); font-size: 12px; outline: none;
  }
  input[type=text]:focus, select:focus { border-color: var(--accent); }
  input[type=text] { width: 220px; }
  .filter-count { color: var(--text2); font-size: 11px; margin-left: auto; }

  /* TABLE */
  .table-wrap { overflow-x: auto; padding: 0 24px 24px; }
  table { width: 100%; border-collapse: collapse; min-width: 900px; }
  thead th {
    background: var(--bg2); color: var(--text2); font-size: 11px; font-weight: 600;
    padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border);
    position: sticky; top: 45px; cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { color: var(--text1); }
  tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s; }
  tbody tr:hover { background: var(--bg3); }
  td { padding: 7px 10px; white-space: nowrap; }
  .td-ticker { font-weight: 700; color: var(--accent2); font-size: 13px; }
  .td-name   { color: var(--text2); max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .td-sector { color: var(--text2); font-size: 11px; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7);
                   z-index: 200; overflow-y: auto; }
  .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; }
  .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
           width: 100%; max-width: 860px; padding: 28px; position: relative; }
  .modal-close { position: absolute; top: 16px; right: 16px; background: var(--bg3);
                 border: none; color: var(--text2); cursor: pointer; border-radius: 6px;
                 padding: 4px 10px; font-size: 16px; }
  .modal-close:hover { color: var(--text1); }
  .modal-title  { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .modal-sub    { color: var(--text2); font-size: 12px; margin-bottom: 20px; }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .kpi-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .kpi-val  { font-size: 22px; font-weight: 700; }
  .kpi-lbl  { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .month-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .m-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px; font-size: 11px; }
  .m-card-lbl { font-weight: 600; color: var(--accent2); margin-bottom: 6px; font-size: 10px; }
  .m-row { display: flex; justify-content: space-between; margin-bottom: 3px; }
  .m-key { color: var(--text2); }
  .partial-badge { font-size: 9px; background: rgba(245,158,11,.15); color: var(--yellow);
                   border: 1px solid rgba(245,158,11,.3); border-radius: 3px; padding: 1px 4px; margin-left: 4px; }

  /* SCORE BAR */
  .score-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 2px; }
  .score-fill { height: 100%; border-radius: 2px; background: var(--accent); }

  /* RISK BADGE */
  .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
  .badge-high   { background: rgba(239,68,68,.15);  color: var(--red);    border: 1px solid rgba(239,68,68,.3); }
  .badge-normal { background: rgba(34,197,94,.1);   color: var(--green);  border: 1px solid rgba(34,197,94,.2); }
  .badge-mid    { background: rgba(245,158,11,.15); color: var(--yellow); border: 1px solid rgba(245,158,11,.3); }
</style>
</head>
<body>

<nav>
  <div class="nav-brand">US <span>MOMENTUM</span></div>
  <a href="index.html"      class="nav-link active">Screener</a>
  <a href="strategies.html" class="nav-link">Stratejiler</a>
</nav>

<div class="meta-bar" id="metaBar">
  <div class="meta-item"><div class="meta-dot"></div>
    <span class="meta-label">Son güncelleme:</span>
    <span class="meta-val" id="metaDate">—</span>
  </div>
  <div class="meta-item">
    <span class="meta-label">Toplam hisse:</span>
    <span class="meta-val" id="metaTotal">—</span>
  </div>
  <div class="meta-item">
    <span class="meta-label">Pozitif momentum:</span>
    <span class="meta-val" id="metaPos">—</span>
  </div>
  <div class="meta-item">
    <span class="meta-label">Kaliteli (FIP<0):</span>
    <span class="meta-val" id="metaNeg">—</span>
  </div>
</div>

<div class="filters">
  <input type="text" id="searchBox" placeholder="Ticker veya şirket ara...">
  <select id="sectorFilter"><option value="">Tüm sektörler</option></select>
  <select id="momFilter">
    <option value="">Tüm momentum</option>
    <option value="pos">Pozitif (Long)</option>
    <option value="neg">Negatif (Short)</option>
  </select>
  <select id="fipFilter">
    <option value="">Tüm FIP</option>
    <option value="neg">Kaliteli (FIP < 0)</option>
    <option value="pos">Zayıf (FIP > 0)</option>
  </select>
  <span class="filter-count" id="filterCount"></span>
</div>

<div class="table-wrap">
  <table id="mainTable">
    <thead>
      <tr>
        <th>#</th>
        <th data-col="ticker">Ticker ↕</th>
        <th data-col="name">Şirket</th>
        <th data-col="sector">Sektör</th>
        <th data-col="mom" class="sort-active">12-1M Mom ↓</th>
        <th data-col="fip">Yıl FIP</th>
        <th data-col="lmom">Ay Mom</th>
        <th data-col="lfip">Ay FIP</th>
        <th data-col="neg">NEG</th>
        <th data-col="pos">POS</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-title" id="mTitle"></div>
    <div class="modal-sub"   id="mSub"></div>
    <div class="kpi-grid" id="mKpi"></div>
    <div class="month-grid" id="mMonths"></div>
  </div>
</div>

<script>
let allStocks = [], sortCol = 'mom', sortAsc = false;

const pct  = v => v == null ? '—' : (v*100).toFixed(2)+'%';
const fp   = v => v == null ? '—' : v.toFixed(4);
const clrM = v => v == null ? '' : v > 0 ? 'color:var(--green)' : v < 0 ? 'color:var(--red)' : 'color:var(--text2)';
const clrF = v => v == null ? '' : v < 0 ? 'color:var(--green)' : v > 0 ? 'color:var(--red)' : 'color:var(--text2)';

async function init() {
  const [meta, stocks] = await Promise.all([
    fetch('data/meta.json').then(r=>r.json()),
    fetch('data/stocks.json').then(r=>r.json()),
  ]);

  document.getElementById('metaDate').textContent  = meta.last_updated;
  document.getElementById('metaTotal').textContent = meta.total;
  document.getElementById('metaPos').textContent   = meta.pos_mom;
  document.getElementById('metaNeg').textContent   = meta.neg_fip;

  allStocks = stocks;

  // Sektörler
  const sectors = [...new Set(stocks.map(s=>s.sector).filter(Boolean))].sort();
  const sel = document.getElementById('sectorFilter');
  sectors.forEach(s => { const o=document.createElement('option'); o.value=o.textContent=s; sel.appendChild(o); });

  document.getElementById('searchBox').addEventListener('input', render);
  document.getElementById('sectorFilter').addEventListener('change', render);
  document.getElementById('momFilter').addEventListener('change', render);
  document.getElementById('fipFilter').addEventListener('change', render);
  document.querySelectorAll('th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      if (sortCol === th.dataset.col) sortAsc = !sortAsc;
      else { sortCol = th.dataset.col; sortAsc = false; }
      render();
    });
  });

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });

  render();
}

function getVal(s, col) {
  const lm = s.last_month, pm = s.prev_month;
  switch(col) {
    case 'ticker': return s.ticker;
    case 'name':   return s.name;
    case 'sector': return s.sector;
    case 'mom':    return s.mom ?? -999;
    case 'fip':    return s.fip ?? 999;
    case 'lmom':   return lm?.momentum ?? -999;
    case 'lfip':   return lm?.fip ?? 999;
    case 'neg':    return lm?.neg_count ?? 0;
    case 'pos':    return lm?.pos_count ?? 0;
    default:       return 0;
  }
}

function render() {
  const q  = document.getElementById('searchBox').value.toLowerCase();
  const sc = document.getElementById('sectorFilter').value;
  const mf = document.getElementById('momFilter').value;
  const ff = document.getElementById('fipFilter').value;

  let list = allStocks.filter(s => {
    if (q  && !s.ticker.toLowerCase().includes(q) && !s.name.toLowerCase().includes(q)) return false;
    if (sc && s.sector !== sc) return false;
    if (mf === 'pos' && !(s.mom > 0)) return false;
    if (mf === 'neg' && !(s.mom < 0)) return false;
    if (ff === 'neg' && !(s.fip < 0)) return false;
    if (ff === 'pos' && !(s.fip > 0)) return false;
    return true;
  });

  list.sort((a,b) => {
    const va=getVal(a,sortCol), vb=getVal(b,sortCol);
    return sortAsc ? (va>vb?1:-1) : (va<vb?1:-1);
  });

  document.getElementById('filterCount').textContent = `${list.length} hisse`;

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = list.map((s,i) => {
    const lm = s.last_month;
    return `<tr onclick="openModal('${s.ticker}')">
      <td style="color:var(--text2)">${i+1}</td>
      <td class="td-ticker">${s.ticker}</td>
      <td class="td-name">${s.name}</td>
      <td class="td-sector">${s.sector||'—'}</td>
      <td style="${clrM(s.mom)}">${pct(s.mom)}</td>
      <td style="${clrF(s.fip)}">${fp(s.fip)}</td>
      <td style="${clrM(lm?.momentum)}">${pct(lm?.momentum)}</td>
      <td style="${clrF(lm?.fip)}">${fp(lm?.fip)}</td>
      <td style="color:var(--red)">${lm?.neg_count??'—'}</td>
      <td style="color:var(--green)">${lm?.pos_count??'—'}</td>
    </tr>`;
  }).join('');
}

async function openModal(ticker) {
  const data = await fetch(`data/detail/${ticker}.json`).then(r=>r.json());
  document.getElementById('mTitle').textContent = `${data.ticker} — ${data.name}`;
  document.getElementById('mSub').textContent   = `${data.type} · ${data.sector}`;

  const lm = data.monthly.at(-1);
  document.getElementById('mKpi').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-val" style="${clrM(data.mom)}">${pct(data.mom)}</div>
      <div class="kpi-lbl">12-1M Momentum</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-val" style="${clrF(data.fip)}">${fp(data.fip)}</div>
      <div class="kpi-lbl">Yıllık FIP</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-val" style="${clrM(lm?.momentum)}">${pct(lm?.momentum)}</div>
      <div class="kpi-lbl">Aylık Mom (${lm?.month||'—'})</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-val" style="${clrF(lm?.fip)}">${fp(lm?.fip)}</div>
      <div class="kpi-lbl">Aylık FIP</div>
    </div>`;

  document.getElementById('mMonths').innerHTML = data.monthly.map(m => `
    <div class="m-card" style="${m.is_partial?'border-color:rgba(245,158,11,.35)':''}">
      <div class="m-card-lbl">${m.month}${m.is_partial?'<span class="partial-badge">⚡ Kısmi</span>':''}</div>
      <div class="m-row"><span class="m-key">Momentum</span><span style="${clrM(m.momentum)}">${pct(m.momentum)}</span></div>
      <div class="m-row"><span class="m-key">FIP</span><span style="${clrF(m.fip)}">${fp(m.fip)}</span></div>
      <div class="m-row"><span class="m-key">Gün</span><span style="color:var(--text2)">${m.total_days}${m.is_partial?' (devam)':''}</span></div>
      <div class="m-row"><span style="color:var(--red)">▼${m.neg_count}</span><span style="color:var(--green)">▲${m.pos_count}</span><span style="color:var(--text2)">=&nbsp;${m.flat_count}</span></div>
    </div>`).join('');

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

init();
</script>
</body>
</html>
