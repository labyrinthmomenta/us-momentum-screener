<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US Momentum Screener</title>
<style>
  body { background: #0a0e17; color: #e2e8f0; font-family: system-ui, sans-serif;
         display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .box { text-align: center; }
  .title { font-size: 28px; font-weight: 700; color: #60a5fa; margin-bottom: 12px; }
  .sub   { color: #94a3b8; font-size: 14px; }
  .dot   { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
           background: #f59e0b; margin-right: 8px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
</style>
</head>
<body>
<div class="box">
  <div class="title">US MOMENTUM SCREENER</div>
  <div class="sub"><span class="dot"></span>İlk veri yükleniyor — lütfen bekleyin...</div>
  <div class="sub" style="margin-top:8px">Actions → "US Momentum — İlk Veri Yükleme" tamamlandığında site aktif olacak.</div>
</div>
</body>
</html>
