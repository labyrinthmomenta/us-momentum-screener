name: US Momentum — Günlük Güncelleme

on:
  schedule:
    - cron: '0 21 * * 1-5'
    - cron: '30 21 * * 5'
  workflow_dispatch:
    inputs:
      force_strategy:
        description: 'Strateji listesini zorla güncelle'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları yükle
        run: pip install yfinance openpyxl

      - name: Güncelle & Derle
        run: |
          if [ "${{ github.event.inputs.force_strategy }}" = "true" ]; then
            python run.py --force-strategy
          else
            python run.py
          fi

      - name: Değişiklikleri kaydet
        run: |
          git config user.name  "US Momentum Bot"
          git config user.email "bot@us-momentum.local"
          git add docs/ run.log US_Momentum_Screener.xlsx
          git diff --staged --quiet || git commit -m "📊 Güncelleme: $(date +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash origin main
          git push
